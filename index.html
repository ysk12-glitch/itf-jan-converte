<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ITF → JAN 変換アプリ</title>

  <!-- バーコード読み取りライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <!-- JANバーコード作成ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", Arial, sans-serif;
      color: #222;
    }

    main {
      max-width: 560px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }

    button.secondary {
      background: #e9e9ee;
      color: #222;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 8px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .result {
      text-align: center;
      font-size: 18px;
      line-height: 1.8;
    }

    .itf {
      font-size: 20px;
      font-weight: bold;
    }

    .jan {
      font-size: 24px;
      font-weight: bold;
      color: #007aff;
    }

    #barcode {
      max-width: 100%;
      margin-top: 15px;
    }

    .message {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<main>

  <h1>📦 ITF → JAN 変換</h1>

  <!-- カメラ読み取り -->
  <div class="card">

    <h2>① ITFバーコードを読み取る</h2>

    <button onclick="startScanner()">
      📷 カメラを起動
    </button>

    <div id="reader"></div>

    <button
      class="secondary"
      onclick="stopScanner()">
      カメラを停止
    </button>

  </div>


  <!-- 手入力 -->
  <div class="card">

    <h2>② ITFコードを直接入力</h2>

    <input
      id="itfInput"
      type="text"
      inputmode="numeric"
      maxlength="14"
      placeholder="14桁のITFコード">

    <button onclick="convertITF()">
      JANに変換
    </button>

  </div>


  <!-- 結果 -->
  <div class="card">

    <h2>③ 変換結果</h2>

    <div class="result">

      <div>
        ITF-14
      </div>

      <div
        id="itfResult"
        class="itf">
        -
      </div>

      <div style="margin-top:15px;">
        JAN-13
      </div>

      <div
        id="janResult"
        class="jan">
        -
      </div>

      <svg id="barcode"></svg>

      <div
        id="message"
        class="message">
      </div>

    </div>

  </div>

</main>


<script>

  let codeReader = null;
  let currentControls = null;


  // =========================
  // ITF → JAN変換
  // =========================

  function convertITF() {

    const input =
      document.getElementById("itfInput").value.trim();

    const digits =
      input.replace(/\D/g, "");

    if (digits.length !== 14) {

      showMessage(
        "ITF-14は14桁で入力してください。",
        true
      );

      return;
    }

    const jan = convertToJAN(digits);

    if (!jan) {

      document.getElementById("itfResult").textContent =
        digits;

      document.getElementById("janResult").textContent =
        "-";

      document.getElementById("barcode").innerHTML = "";

      showMessage(
        "このITF-14はJAN-13へ直接変換できません。先頭が0のITF-14のみ対応しています。",
        true
      );

      return;
    }

    displayResult(digits, jan);
  }


  // =========================
  // ITF-14 → JAN-13
  // =========================

  function convertToJAN(itf) {

    // ITF-14 → JAN-13は
    // 先頭が「0」の場合に変換可能
    if (itf.length !== 14) {
      return null;
    }

    if (itf.charAt(0) !== "0") {
      return null;
    }

    return itf.substring(1);
  }


  // =========================
  // 結果表示
  // =========================

  function displayResult(itf, jan) {

    document.getElementById("itfResult").textContent =
      itf;

    document.getElementById("janResult").textContent =
      jan;

    document.getElementById("message").textContent =
      "変換しました！";

    document.getElementById("message").style.color =
      "#007aff";

    // JANバーコード作成
    JsBarcode("#barcode", jan, {
      format: "EAN13",
      width: 2,
      height: 100,
      displayValue: true,
      fontSize: 18,
      margin: 10
    });
  }


  // =========================
  // メッセージ
  // =========================

  function showMessage(text, error) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.style.color =
      error ? "#ff3b30" : "#007aff";
  }


  // =========================
  // カメラ起動
  // =========================

  async function startScanner() {

    try {

      document.getElementById("reader").innerHTML = "";

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();

      const videoInputDevices =
        await ZXingBrowser.BrowserCodeReader
          .listVideoInputDevices();

      if (!videoInputDevices.length) {

        showMessage(
          "カメラが見つかりません。",
          true
        );

        return;
      }

      // 背面カメラを優先
      let selectedDevice =
        videoInputDevices[videoInputDevices.length - 1];

      for (const device of videoInputDevices) {

        const label =
          (device.label || "").toLowerCase();

        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {
          selectedDevice = device;
          break;
        }
      }

      currentControls =
        await codeReader.decodeFromVideoDevice(
          selectedDevice.deviceId,
          "reader",
          (result, error, controls) => {

            if (result) {

              const text =
                result.getText().trim();

              // 数字だけ取り出す
              const digits =
                text.replace(/\D/g, "");

              if (digits.length === 14) {

                document.getElementById(
                  "itfInput"
                ).value = digits;

                convertITF();

                // 読み取り停止
                controls.stop();
              }
            }

          }
        );

      showMessage(
        "バーコードをカメラに映してください。",
        false
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "カメラを起動できませんでした。Safariのカメラ許可を確認してください。",
        true
      );
    }
  }


  // =========================
  // カメラ停止
  // =========================

  function stopScanner() {

    if (currentControls) {

      currentControls.stop();
      currentControls = null;
    }

    document.getElementById("reader").innerHTML = "";
  }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITF-14 → JAN変換</title>

<script src="https://unpkg.com/@zxing/library@0.21.3"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

h1 {
    font-size: 24px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #007aff;
    color: white;
}

#status {
    margin: 15px;
    font-size: 16px;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 12px;
}

#barcode {
    margin-top: 15px;
    max-width: 100%;
}
</style>
</head>

<body>

<h1>ITF-14 → JAN変換</h1>

<div id="reader">
    <video id="video" autoplay playsinline></video>
</div>

<button id="startButton">📷 カメラを起動</button>
<button id="stopButton">⏹ カメラ停止</button>

<div id="status">「カメラを起動」を押してください</div>

<div id="result">
    <div>読み取り結果</div>
    <h2 id="code">---</h2>
    <div id="janText"></div>
    <svg id="barcode"></svg>
</div>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");
const code = document.getElementById("code");
const janText = document.getElementById("janText");
const barcode = document.getElementById("barcode");

let stream = null;
let reader = null;
let scanning = false;

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");


// ==========================
// カメラ起動
// ==========================

async function startCamera() {

    stopCamera();

    status.textContent = "カメラを起動しています…";

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error("この環境ではカメラを使用できません");
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        status.textContent = "バーコードをカメラに映してください";

        startScanning();

    } catch (error) {

        console.error(error);

        status.textContent =
            "カメラを起動できませんでした。Safariのカメラ許可を確認してください。";

    }
}


// ==========================
// バーコード読み取り
// ==========================

function startScanning() {

    if (scanning) return;

    scanning = true;

    reader = new ZXing.BrowserMultiFormatReader();

    reader.decodeFromVideoElement(
        video,
        (result, error) => {

            if (result) {

                const text = result.getText();

                handleBarcode(text);
            }

        }
    );
}


// ==========================
// バーコード停止
// ==========================

function stopCamera() {

    scanning = false;

    if (reader) {

        try {
            reader.reset();
        } catch (e) {}

        reader = null;
    }

    if (stream) {

        stream.getTracks().forEach(track => {
            track.stop();
        });

        stream = null;
    }

    video.srcObject = null;
}


// ==========================
// ITF-14 → JAN-13
// ==========================

function handleBarcode(value) {

    value = value.replace(/\D/g, "");

    code.textContent = value;

    // ITF-14
    if (value.length === 14) {

        /*
         ITF-14
         例：
         14912345678905

         JAN-13にする場合、
         先頭の物流識別コードを除いた
         13桁部分を使用
        */

        const jan = value.substring(1);

        janText.innerHTML =
            "<strong>JAN-13：</strong>" + jan;

        drawBarcode(jan);

        status.textContent = "読み取り成功！";

        return;
    }

    status.textContent =
        "14桁のITF-14バーコードを読み取ってください。";
}


// ==========================
// JANバーコード表示
// ==========================

function drawBarcode(value) {

    if (typeof JsBarcode === "undefined") {

        loadJsBarcode(value);

        return;
    }

    JsBarcode("#barcode", value, {
        format: "EAN13",
        width: 2,
        height: 100,
        displayValue: true,
        margin: 10
    });
}


// ==========================
// JsBarcode読み込み
// ==========================

function loadJsBarcode(value) {

    const script = document.createElement("script");

    script.src =
        "https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js";

    script.onload = function() {

        JsBarcode("#barcode", value, {
            format: "EAN13",
            width: 2,
            height: 100,
            displayValue: true,
            margin: 10
        });

    };

    document.head.appendChild(script);
}


// ==========================
// ボタン
// ==========================

startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    function() {

        stopCamera();

        status.textContent =
            "カメラを停止しました。";

    }
);


// ページを離れるとき
window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>

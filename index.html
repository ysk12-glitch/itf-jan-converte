<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITF-14 → JAN変換</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
}

h1 {
    font-size: 24px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

button {
    width: 90%;
    max-width: 500px;
    padding: 15px;
    margin: 10px auto;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 18px;
}

.result {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: white;
    border-radius: 15px;
}

.label {
    color: #666;
    margin-top: 10px;
}

.code {
    font-size: 26px;
    font-weight: bold;
    word-break: break-all;
}

#status {
    margin: 15px;
}

.success {
    color: green;
}

.error {
    color: red;
}

</style>
</head>

<body>

<h1>📦 ITF-14 → JAN変換</h1>

<div id="reader"></div>

<div id="status">
カメラを起動しています…
</div>

<div class="result">

<div class="label">
読み取ったITF-14
</div>

<div id="itf" class="code">
---
</div>

<div class="label">
JAN-13
</div>

<div id="jan" class="code">
---
</div>

</div>

<script>

let scanner = null;


/* =========================
   チェックデジット計算
========================= */

function checkDigit(code) {

    let sum = 0;

    for (let i = 0; i < 13; i++) {

        let number = Number(code[i]);

        if (i % 2 === 0) {

            sum += number * 3;

        } else {

            sum += number;

        }

    }

    return (10 - (sum % 10)) % 10;

}


/* =========================
   ITF-14 → JAN-13
========================= */

function convertITF14(value) {

    let code = value.replace(/\D/g, "");

    console.log("読み取り:", code);

    /*
       ITF-14は14桁
    */

    if (code.length !== 14) {

        document.getElementById("status").textContent =
            "ITF-14を読み取り中…";

        return;

    }


    /*
       チェックデジット確認
    */

    let calculated =
        checkDigit(code.substring(0, 13));

    let actual =
        Number(code.substring(13, 14));


    if (calculated !== actual) {

        document.getElementById("status").textContent =
            "バーコードは読めましたが、チェックデジットが違います";

        return;

    }


    /*
       今回のITF-14

       04514603362305

       ↓

       4514603362305
    */

    if (code.substring(0, 1) !== "0") {

        document.getElementById("status").textContent =
            "先頭が0ではないITF-14です";

        return;

    }


    let jan =
        code.substring(1);


    document.getElementById("itf").textContent =
        code;

    document.getElementById("jan").textContent =
        jan;

    document.getElementById("status").textContent =
        "✅ 読み取り成功！";

    document.getElementById("status").className =
        "success";


    if (navigator.vibrate) {

        navigator.vibrate(100);

    }


    /*
       読み取り成功したら停止
    */

    if (scanner) {

        scanner.stop().catch(function(error) {

            console.log(error);

        });

    }

}


/* =========================
   読み取り成功
========================= */

function onScanSuccess(decodedText, decodedResult) {

    console.log(
        "バーコード:",
        decodedText
    );

    console.log(
        "形式:",
        decodedResult
    );

    convertITF14(decodedText);

}


/* =========================
   読み取り失敗
========================= */

function onScanFailure(error) {

    /*
       失敗するたびに表示すると
       画面がちらつくので何もしない
    */

}


/* =========================
   スキャナー設定
========================= */

const formatsToSupport = [

    Html5QrcodeSupportedFormats.ITF

];


scanner = new Html5Qrcode(
    "reader",
    {
        formatsToSupport:
            formatsToSupport
    }
);


/* =========================
   カメラ開始
========================= */

scanner.start(

    {
        facingMode: "environment"
    },

    {

        fps: 10,

        /*
           ITFは横長なので
           横長の読み取り枠にする
        */

        qrbox: {
            width: 350,
            height: 120
        },

        aspectRatio: 1.7777778,

        disableFlip: false

    },

    onScanSuccess,

    onScanFailure

)
.then(function() {

    document.getElementById("status").textContent =
        "📷 バーコードを枠の中に入れてください";

})
.catch(function(error) {

    console.error(error);

    document.getElementById("status").textContent =
        "カメラを起動できませんでした。Safariのカメラ許可を確認してください。";

    document.getElementById("status").className =
        "error";

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITF-14 読み取りテスト</title>

<script src="https://unpkg.com/@zxing/library@0.21.3"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

h1 {
    font-size: 24px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #007aff;
    color: white;
}

#stopButton {
    background: #666;
}

#status {
    margin: 15px;
    font-size: 16px;
}

#result {
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 12px;
}

#code {
    font-size: 30px;
    letter-spacing: 2px;
    word-break: break-all;
}

#debug {
    margin-top: 15px;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<h1>ITF-14 読み取りテスト</h1>

<div id="reader">
    <video id="video" autoplay playsinline muted></video>
</div>

<button id="startButton">📷 カメラを起動</button>
<button id="stopButton">⏹ カメラ停止</button>

<div id="status">
    「カメラを起動」を押してください
</div>

<div id="result">

    <div>読み取り結果</div>

    <h2 id="code">---</h2>

    <div id="debug">
        ITF-14バーコードを映してください
    </div>

</div>


<script>

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const code =
    document.getElementById("code");

const debug =
    document.getElementById("debug");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

let stream = null;
let reader = null;
let scanning = false;


// =====================================
// カメラ起動
// =====================================

async function startCamera() {

    stopCamera();

    code.textContent = "---";

    debug.textContent =
        "ITF-14バーコードを映してください";

    status.textContent =
        "カメラを起動しています…";

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }
                },

                audio: false

            });


        video.srcObject = stream;

        await video.play();


        status.textContent =
            "バーコードを映してください";


        startScanning();


    } catch (error) {

        console.error(error);

        status.textContent =
            "カメラを起動できませんでした。";

    }
}


// =====================================
// 読み取り開始
// =====================================

function startScanning() {

    if (scanning) {
        return;
    }

    scanning = true;


    // ITFを指定
    const hints = new Map();


    hints.set(
        ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [
            ZXing.BarcodeFormat.ITF
        ]
    );


    hints.set(
        ZXing.DecodeHintType.TRY_HARDER,
        true
    );


    try {

        reader =
            new ZXing.BrowserMultiFormatReader(
                hints
            );


        reader.decodeFromVideoElement(
            video,

            function(result, error) {

                if (!scanning) {
                    return;
                }


                if (result) {

                    const text =
                        result.getText();


                    console.log(
                        "★★ 認識成功 ★★",
                        text
                    );


                    showResult(text);

                }

            }
        );


    } catch (error) {

        console.error(
            "読み取りエラー",
            error
        );

        debug.textContent =
            "読み取り機能の起動に失敗しました。";

    }
}


// =====================================
// 結果表示
// =====================================

function showResult(value) {

    value =
        value.replace(/\D/g, "");


    code.textContent =
        value;


    debug.innerHTML =
        "✅ バーコードを認識しました！<br>" +
        "桁数：" +
        value.length;


    status.textContent =
        "読み取り成功！";


    console.log(
        "認識した数字：",
        value
    );

}


// =====================================
// カメラ停止
// =====================================

function stopCamera() {

    scanning = false;


    if (reader) {

        try {
            reader.reset();
        } catch (e) {}

        reader = null;
    }


    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

        stream = null;
    }


    video.srcObject = null;
}


// =====================================
// ボタン
// =====================================

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    function() {

        stopCamera();

        status.textContent =
            "カメラを停止しました。";

    }
);


// =====================================
// ページを離れたとき
// =====================================

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>

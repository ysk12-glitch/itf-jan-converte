        このケースITFとバラ売りJANの対応を登録しています。
    </p>

</div>

    </p>

</div>

    📷 もう一度スキャン
</button>

<div class="menu">

            onclick="showHistory()">

        📜 変換履歴

    </button>

    </button>

<div id="historySection"
     class="section"

         class="count">
    </div>

            onclick="exportHistoryCSV()">

            onclick="clearHistory()">

         class="count">
    </div>

        id="mappingSearch"
        type="tel"
        inputmode="numeric"

    >

    </div>

            onclick="exportMappingCSV()">

        📥 登録データをCSV出力

    </button>

        📤 CSVから一括登録

            type="file"
            id="csvFile"
            accept=".csv,text/csv"
            onchange="importMappingCSV(event)"
        >

    </label>


    <p class="small">
        CSV形式：<br>
        ケースITF-14,バラ売りJAN
    </p>


    <button class="red"
            onclick="clearMappings()">

        🗑️ 登録データを全部削除

    </button>

</div>


<script>


/* =====================================
   スキャナー
===================================== */

let scanner = null;

let isScanning = false;


/* =====================================
   チェックデジット
===================================== */

function calculateCheckDigit(code) {

    let sum = 0;

    for (let i = code.length - 1;
         i >= 0;
         i--) {

        let number = Number(code[i]);

        let positionFromRight =
            code.length - i;

        if (positionFromRight % 2 === 1) {

            sum += number * 3;

        } else {

            sum += number;

        }

    }

    return (10 - (sum % 10)) % 10;

}


/* =====================================
   JANチェック
===================================== */

function isValidJan(jan) {

    if (!/^\d{13}$/.test(jan)) {

        return false;

    }

    let calculated =
        calculateCheckDigit(
            jan.substring(0, 12)
        );

    return calculated ===
        Number(jan.substring(12));

}


/* =====================================
   登録データ取得
===================================== */

function getMappings() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "caseToUnitJAN"
            ) || "{}"
        );

    } catch (error) {

        return {};

    }

}


/* =====================================
   履歴取得
===================================== */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "conversionHistory"
            ) || "[]"
        );

    } catch (error) {

        return [];

    }

}


/* =====================================
   履歴追加
===================================== */

function addHistory(
    itf,
    jan,
    method
) {

    let history =
        getHistory();


    /*
       同じITF・JANを短時間に
       何度も登録しない
    */

    let now =
        Date.now();


    if (history.length > 0) {

        let latest =
            history[0];


        if (
            latest.itf === itf &&
            latest.jan === jan &&
            now - latest.timestamp < 5000
        ) {

            return;

        }

    }


    history.unshift({

        date:
            new Date().toLocaleString(
                "ja-JP"
            ),

        timestamp:
            now,

        itf:
            itf,

        jan:
            jan,

        method:
            method

    });


    localStorage.setItem(
        "conversionHistory",
        JSON.stringify(history)
    );

}


/* =====================================
   ITF変換
===================================== */

function convertITF14(value) {

    let code =
        value.replace(/\D/g, "");


    if (code.length !== 14) {

        return;

    }


    /* チェック */

    let calculated =
        calculateCheckDigit(
            code.substring(0, 13)
        );


    let actual =
        Number(code.substring(13));


    if (calculated !== actual) {

        document.getElementById(
            "status"
        ).textContent =
            "⚠️ チェックデジットが違います";

        document.getElementById(
            "status"
        ).className =
            "error";

        return;

    }


    document.getElementById(
        "itf"
    ).textContent =
        code;


    /* 登録データ確認 */

    let mappings =
        getMappings();


    let registeredJan =
        mappings[code];


    if (registeredJan) {

        document.getElementById(
            "jan"
        ).textContent =
            registeredJan;


        document.getElementById(
            "registeredJan"
        ).textContent =
            registeredJan;


        document.getElementById(
            "registeredArea"
        ).style.display =
            "block";


        document.getElementById(
            "registerArea"
        ).style.display =
            "none";


        document.getElementById(
            "status"
        ).textContent =
            "✅ 登録済みのバラJANを表示しました！";


        document.getElementById(
            "status"
        ).className =
            "success";


        addHistory(
            code,
            registeredJan,
            "登録データ"
        );


        stopScanner();

        vibrate();

        return;

    }


    /* =================================
       自動変換
    ================================= */

    let firstDigit =
        code.substring(0, 1);


    if (/^[1-8]$/.test(firstDigit)) {

        let body =
            code.substring(1, 13);


        let janCheck =
            calculateCheckDigit(body);


        let candidateJan =
            body + janCheck;


        document.getElementById(
            "jan"
        ).textContent =
            candidateJan;


        document.getElementById(
            "status"
        ).textContent =
            "✅ バラJANを計算しました";


        document.getElementById(
            "status"
        ).className =
            "success";


        document.getElementById(
            "registerArea"
        ).style.display =
            "none";


        document.getElementById(
            "registeredArea"
        ).style.display =
            "none";


        addHistory(
            code,
            candidateJan,
            "自動変換"
        );

    }


    /* =================================
       0始まり
    ================================= */

    else if (firstDigit === "0") {

        let candidateJan =
            code.substring(1);


        document.getElementById(
            "jan"
        ).textContent =
            candidateJan;


        document.getElementById(
            "status"
        ).textContent =
            "⚠️ ケース販売用JANの可能性があります";


        document.getElementById(
            "status"
        ).className =
            "warning";


        document.getElementById(
            "registerArea"
        ).style.display =
            "block";


        document.getElementById(
            "registeredArea"
        ).style.display =
            "none";


        addHistory(
            code,
            candidateJan,
            "ITF表示上のGTIN-13"
        );

    }


    else {

        document.getElementById(
            "jan"
        ).textContent =
            "---";


        document.getElementById(
            "status"
        ).textContent =
            "⚠️ このITFは自動変換できません";


        document.getElementById(
            "status"
        ).className =
            "warning";


        document.getElementById(
            "registerArea"
        ).style.display =
            "block";


        document.getElementById(
            "registeredArea"
        ).style.display =
            "none";

    }


    stopScanner();

    vibrate();

}


/* =====================================
   バイブレーション
===================================== */

function vibrate() {

    if (navigator.vibrate) {

        navigator.vibrate(100);

    }

}


/* =====================================
   登録
===================================== */

function saveMapping() {

    let jan =
        document.getElementById(
            "unitJanInput"
        ).value
        .replace(/\D/g, "");


    let itf =
        document.getElementById(
            "itf"
        ).textContent;


    if (itf.length !== 14) {

        alert(
            "ITF-14がありません"
        );

        return;

    }


    if (!isValidJan(jan)) {

        alert(
            "JAN-13が正しくありません。\n" +
            "チェックデジットを確認してください。"
        );

        return;

    }


    let mappings =
        getMappings();


    mappings[itf] =
        jan;


    localStorage.setItem(
        "caseToUnitJAN",
        JSON.stringify(mappings)
    );


    document.getElementById(
        "jan"
    ).textContent =
        jan;


    document.getElementById(
        "registeredJan"
    ).textContent =
        jan;


    document.getElementById(
        "registeredArea"
    ).style.display =
        "block";


    document.getElementById(
        "registerArea"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).textContent =
        "✅ バラJANを登録しました！";


    document.getElementById(
        "status"
    ).className =
        "success";


    document.getElementById(
        "unitJanInput"
    ).value = "";


    addHistory(
        itf,
        jan,
        "新規登録"
    );


    showMappings();

}


/* =====================================
   スキャナー停止
===================================== */

async function stopScanner() {

    if (!scanner) {

        return;

    }


    try {

        if (isScanning) {

            await scanner.stop();

        }

    } catch (error) {

        console.log(
            "stop:",
            error
        );

    }


    isScanning = false;

}


/* =====================================
   スキャナー完全終了
===================================== */

async function destroyScanner() {

    await stopScanner();


    if (scanner) {

        try {

            await scanner.clear();

        } catch (error) {

            console.log(
                "clear:",
                error
            );

        }

    }


    scanner = null;


    document.getElementById(
        "reader"
    ).innerHTML = "";

}


/* =====================================
   スキャナー起動
===================================== */

async function startScanner() {

    await destroyScanner();


    document.getElementById(
        "status"
    ).textContent =
        "📷 カメラを起動しています…";


    document.getElementById(
        "status"
    ).className = "";


    const formatsToSupport = [

        Html5QrcodeSupportedFormats.ITF

    ];


    scanner =
        new Html5Qrcode(
            "reader",
            {
                formatsToSupport:
                    formatsToSupport
            }
        );


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,

                qrbox: {
                    width: 350,
                    height: 120
                },

                aspectRatio:
                    1.7777778,

                disableFlip:
                    false

            },

            onScanSuccess,

            onScanFailure

        );


        isScanning = true;


        document.getElementById(
            "status"
        ).textContent =
            "📷 バーコードを枠の中に入れてください";


    } catch (error) {

        console.error(error);


        document.getElementById(
            "status"
        ).textContent =
            "カメラを起動できませんでした。Safariのカメラ許可を確認してください。";


        document.getElementById(
            "status"
        ).className =
            "error";

    }

}


/* =====================================
   スキャン成功
===================================== */

function onScanSuccess(
    decodedText,
    decodedResult
) {

    if (!isScanning) {

        return;

    }


    isScanning = false;


    convertITF14(
        decodedText
    );

}


/* =====================================
   スキャン失敗
===================================== */

function onScanFailure(error) {

    /* 通常の読み取り失敗なので何もしない */

}


/* =====================================
   再スキャン
===================================== */

async function restartScanner() {

    document.getElementById(
        "status"
    ).textContent =
        "🔄 カメラを再起動しています…";


    document.getElementById(
        "status"
    ).className = "";


    document.getElementById(
        "itf"
    ).textContent =
        "---";


    document.getElementById(
        "jan"
    ).textContent =
        "---";


    document.getElementById(
        "registerArea"
    ).style.display =
        "none";


    document.getElementById(
        "registeredArea"
    ).style.display =
        "none";


    await startScanner();

}


/* =====================================
   履歴表示
===================================== */

function showHistory() {

    document.getElementById(
        "historySection"
    ).style.display =
        "block";


    let history =
        getHistory();


    document.getElementById(
        "historyCount"
    ).textContent =
        "履歴：" +
        history.length +
        "件";


    let list =
        document.getElementById(
            "historyList"
        );


    if (history.length === 0) {

        list.innerHTML =
            '<div class="empty">履歴はありません</div>';

        return;

    }


    let html = "";


    history.forEach(function(item) {

        html +=

            '<div class="listItem">' +

            '<strong>' +
            item.date +
            '</strong><br>' +

            'ITF-14：' +
            item.itf +
            '<br>' +

            'JAN：' +
            item.jan +
            '<br>' +

            '<span class="small">' +
            '方法：' +
            item.method +
            '</span>' +

            '</div>';

    });


    list.innerHTML =
        html;

}


/* =====================================
   登録データ表示
===================================== */

function showMappings() {

    document.getElementById(
        "mappingSection"
    ).style.display =
        "block";


    let mappings =
        getMappings();


    let keys =
        Object.keys(mappings);


    document.getElementById(
        "mappingCount"
    ).textContent =
        "登録：" +
        keys.length +
        "件";


    let search =
        document.getElementById(
            "mappingSearch"
        ).value
        .replace(/\D/g, "");


    let list =
        document.getElementById(
            "mappingList"
        );


    let filtered =
        keys.filter(function(itf) {

            if (!search) {

                return true;

            }


            return (
                itf.includes(search) ||
                mappings[itf].includes(search)
            );

        });


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">該当する登録データはありません</div>';

        return;

    }


    let html = "";


    filtered.forEach(function(itf) {

        html +=

            '<div class="listItem">' +

            'ケースITF：<strong>' +
            itf +
            '</strong><br>' +

            'バラJAN：<strong>' +
            mappings[itf] +
            '</strong><br>' +

            '<button class="deleteButton" ' +
            'onclick="deleteMapping(\'' +
            itf +
            '\')">' +

            'この登録を削除' +

            '</button>' +

            '</div>';

    });


    list.innerHTML =
        html;

}


/* =====================================
   1件削除
===================================== */

function deleteMapping(itf) {

    if (
        !confirm(
            "この登録を削除しますか？\n\n" +
            itf
        )
    ) {

        return;

    }


    let mappings =
        getMappings();


    delete mappings[itf];


    localStorage.setItem(
        "caseToUnitJAN",
        JSON.stringify(mappings)
    );


    showMappings();

}


/* =====================================
   CSVエスケープ
===================================== */

function csvEscape(value) {

    value =
        String(value);


    if (
        value.includes(",") ||
        value.includes('"') ||
        value.includes("\n")
    ) {

        return '"' +
            value.replace(
                /"/g,
                '""'
            ) +
            '"';

    }


    return value;

}


/* =====================================
   CSVダウンロード
===================================== */

function downloadCSV(
    csv,
    filename
) {

    let bom =
        "\uFEFF";


    let blob =
        new Blob(
            [bom + csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    let url =
        URL.createObjectURL(blob);


    let link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/* =====================================
   履歴CSV
===================================== */

function exportHistoryCSV() {

    let history =
        getHistory();


    if (history.length === 0) {

        alert(
            "変換履歴がありません"
        );

        return;

    }


    let csv =
        "日時,ITF-14,JAN,変換方法\n";


    history.forEach(function(item) {

        csv +=
            csvEscape(item.date) +
            "," +
            csvEscape(item.itf) +
            "," +
            csvEscape(item.jan) +
            "," +
            csvEscape(item.method) +
            "\n";

    });


    downloadCSV(
        csv,
        "ITF_JAN_変換履歴.csv"
    );

}


/* =====================================
   登録データCSV
===================================== */

function exportMappingCSV() {

    let mappings =
        getMappings();


    let keys =
        Object.keys(mappings);


    if (keys.length === 0) {

        alert(
            "登録データがありません"
        );

        return;

    }


    let csv =
        "ケースITF-14,バラ売りJAN\n";


    keys.forEach(function(itf) {

        csv +=
            csvEscape(itf) +
            "," +
            csvEscape(
                mappings[itf]
            ) +
            "\n";

    });


    downloadCSV(
        csv,
        "ITF_JAN_登録データ.csv"
    );

}


/* =====================================
   CSV一括登録
===================================== */

function importMappingCSV(event) {

    let file =
        event.target.files[0];


    if (!file) {

        return;

    }


    let reader =
        new FileReader();


    reader.onload =
        function(e) {

            let text =
                e.target.result;


            /*
               BOM除去
            */

            text =
                text.replace(
                    /^\uFEFF/,
                    ""
                );


            let lines =
                text.split(/\r?\n/);


            let mappings =
                getMappings();


            let successCount =
                0;


            let errorCount =
                0;


            lines.forEach(
                function(line, index) {

                    if (
                        !line.trim()
                    ) {

                        return;

                    }


                    /*
                       ヘッダーを飛ばす
                    */

                    if (
                        index === 0 &&
                        line.includes(
                            "ITF"
                        )
                    ) {

                        return;

                    }


                    let parts =
                        line.split(",");


                    if (
                        parts.length < 2
                    ) {

                        errorCount++;

                        return;

                    }


                    let itf =
                        parts[0]
                        .replace(
                            /\D/g,
                            ""
                        );


                    let jan =
                        parts[1]
                        .replace(
                            /\D/g,
                            ""
                        );


                    if (
                        itf.length === 14 &&
                        isValidJan(jan)
                    ) {

                        mappings[itf] =
                            jan;

                        successCount++;

                    } else {

                        errorCount++;

                    }

                }
            );


            localStorage.setItem(
                "caseToUnitJAN",
                JSON.stringify(
                    mappings
                )
            );


            alert(
                "CSV登録完了！\n\n" +
                "登録：" +
                successCount +
                "件\n" +
                "エラー：" +
                errorCount +
                "件"
            );


            event.target.value =
                "";


            showMappings();

        };


    reader.readAsText(
        file,
        "UTF-8"
    );

}


/* =====================================
   履歴削除
===================================== */

function clearHistory() {

    if (
        !confirm(
            "変換履歴をすべて削除しますか？"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "conversionHistory"
    );


    showHistory();

}


/* =====================================
   登録データ全削除
===================================== */

function clearMappings() {

    if (
        !confirm(
            "登録したITFとJANの対応をすべて削除しますか？"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "caseToUnitJAN"
    );


    showMappings();

}


/* =====================================
   起動
===================================== */

startScanner();

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITF-14 → JAN 変換アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;padding:20px}
.container{max-width:600px;margin:auto}
h1{text-align:center}
.box{background:#fff;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 2px 8px #0001}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:10px;background:#007aff;color:#fff;font-size:17px;font-weight:bold}
.stop{background:#777}
input{width:100%;padding:13px;font-size:18px;box-sizing:border-box;border:1px solid #ccc;border-radius:10px}
video{width:100%;margin-top:15px;border-radius:12px;background:#000;display:block}
.result{text-align:center}.itf{font-size:20px;font-weight:bold}.jan{font-size:25px;font-weight:bold;margin-top:10px}
#barcode{max-width:100%;margin-top:15px}
#message{text-align:center;margin-top:15px;font-weight:bold}
.note{font-size:13px;color:#666;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>📦 ITF-14 → JAN-13</h1>

<div class="box">
<h2>① ITF-14をカメラで読み取る</h2>
<button onclick="startCamera()">📷 カメラを起動</button>
<video id="video" autoplay muted playsinline></video>
<button class="stop" onclick="stopCamera()">カメラを停止</button>
<div id="message">「カメラを起動」を押してください。</div>
<p class="note">バーコード全体が映るようにしてください。ピントが合うまで少し待つと読み取りやすくなります。</p>
</div>

<div class="box">
<h2>② ITF-14を直接入力</h2>
<input id="input" type="text" inputmode="numeric" maxlength="14" placeholder="ITF-14（14桁）">
<button onclick="convert()">JANに変換</button>
</div>

<div class="box">
<h2>③ 変換結果</h2>
<div class="result">
<div>ITF-14</div>
<div id="itf" class="itf">---</div>
<div style="margin-top:20px">JAN-13</div>
<div id="jan" class="jan">---</div>
<svg id="barcode"></svg>
</div>
</div>
</div>

<script>
let stream=null;
let reader=null;
let controls=null;

async function startCamera(){
  stopCamera();
  const message=document.getElementById("message");
  try{
    message.textContent="カメラを起動しています…";

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("このブラウザではカメラを利用できません");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    const video=document.getElementById("video");
    video.srcObject=stream;
    await video.play();

    message.textContent="バーコードをカメラに映してください。";

    reader=new ZXingBrowser.BrowserMultiFormatReader();

    /*
      ITFを明示的に指定。
      ZXingのITFフォーマットはITF-14を読み取るのに使用できます。
    */
    const hints=new Map();
    hints.set(
      ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,
      [ZXingBrowser.BarcodeFormat.ITF]
    );

    reader=new ZXingBrowser.BrowserMultiFormatReader(hints);

    controls=await reader.decodeFromVideoDevice(
      undefined,
      video,
      (result,error,ctrl)=>{
        if(!result) return;

        const raw=result.getText().trim();
        const digits=raw.replace(/\D/g,"");

        if(digits.length===14){
          document.getElementById("input").value=digits;
          convert();
          message.textContent="読み取り成功！";
          ctrl.stop();
          stopCamera();
        }else{
          message.textContent="バーコードを認識しました。14桁になるまで調整してください。";
        }
      }
    );

  }catch(error){
    console.error(error);
    message.textContent="カメラを起動できませんでした。Safariのカメラ許可を確認してください。";
  }
}

function stopCamera(){
  if(controls){
    try{controls.stop();}catch(e){}
    controls=null;
  }
  if(reader){
    try{reader.reset();}catch(e){}
  }
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }
  document.getElementById("video").srcObject=null;
}

function convert(){
  const value=document.getElementById("input").value.replace(/\D/g,"");

  if(value.length!==14){
    document.getElementById("message").textContent="ITF-14は14桁で入力してください。";
    return;
  }

  if(value.charAt(0)!=="0"){
    document.getElementById("message").textContent="現在は先頭が0のITF-14に対応しています。";
    return;
  }

  const jan=value.substring(1);

  document.getElementById("itf").textContent=value;
  document.getElementById("jan").textContent=jan;

  try{
    JsBarcode("#barcode",jan,{
      format:"EAN13",
      width:2,
      height:100,
      displayValue:true,
      fontSize:18,
      margin:10
    });
  }catch(error){
    console.error(error);
    document.getElementById("message").textContent="JANバーコードの表示に失敗しました。";
    return;
  }

  document.getElementById("message").textContent="変換しました！";
}
</script>
</body>
</html>

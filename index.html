<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITF → JAN 変換アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;padding:20px}
.container{max-width:600px;margin:auto} h1{text-align:center}
.box{background:white;padding:20px;margin:15px 0;border-radius:15px}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:10px;background:#007aff;color:white;font-size:17px;font-weight:bold}
button.stop{background:#777} input{width:100%;padding:13px;font-size:18px;box-sizing:border-box;border:1px solid #ccc;border-radius:10px}
video{width:100%;margin-top:15px;border-radius:12px;background:#000}
.result{text-align:center}.itf{font-size:20px;font-weight:bold}.jan{font-size:25px;font-weight:bold;margin-top:10px}
#barcode{max-width:100%;margin-top:15px}#message{text-align:center;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>📦 ITF → JAN</h1>
<div class="box">
<h2>① カメラで読み取る</h2>
<button onclick="startCamera()">📷 カメラを起動</button>
<video id="video" autoplay playsinline></video>
<button class="stop" onclick="stopCamera()">カメラを停止</button>
</div>
<div class="box">
<h2>② ITF-14を直接入力</h2>
<input id="input" type="text" inputmode="numeric" placeholder="ITF-14（14桁）">
<button onclick="convert()">JANに変換</button>
</div>
<div class="box">
<h2>③ 変換結果</h2>
<div class="result">
<div>ITF-14</div><div id="itf" class="itf">---</div>
<div style="margin-top:20px">JAN-13</div><div id="jan" class="jan">---</div>
<svg id="barcode"></svg>
</div>
<div id="message"></div>
</div>
</div>
<script>
let stream=null,reader=null,controls=null;
async function startCamera(){
 try{
  document.getElementById("message").textContent="カメラを起動しています…";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Camera unavailable");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  const video=document.getElementById("video"); video.srcObject=stream; await video.play();
  document.getElementById("message").textContent="バーコードをカメラに映してください";
  startBarcodeReader();
 }catch(e){console.error(e);document.getElementById("message").textContent="カメラを起動できませんでした。Safariのカメラ許可を確認してください。";}
}
async function startBarcodeReader(){
 try{
  reader=new ZXingBrowser.BrowserMultiFormatReader();
  const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
  if(!devices.length)throw new Error("No camera");
  let device=devices[devices.length-1];
  for(const d of devices){const label=(d.label||"").toLowerCase();if(label.includes("back")||label.includes("rear")||label.includes("environment")){device=d;break;}}
  controls=await reader.decodeFromVideoDevice(device.deviceId,"video",(result,error,ctrl)=>{
   if(result){const value=result.getText().replace(/\D/g,"");if(value.length===14){document.getElementById("input").value=value;convert();ctrl.stop();stopCamera();}}
  });
 }catch(e){console.error(e);}
}
function stopCamera(){
 if(controls){try{controls.stop()}catch(e){}controls=null}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 document.getElementById("video").srcObject=null;
}
function convert(){
 const value=document.getElementById("input").value.replace(/\D/g,"");
 if(value.length!==14){document.getElementById("message").textContent="ITF-14は14桁で入力してください。";return}
 if(value.charAt(0)!=="0"){document.getElementById("message").textContent="現在は先頭が0のITF-14に対応しています。";return}
 const jan=value.substring(1);
 document.getElementById("itf").textContent=value;
 document.getElementById("jan").textContent=jan;
 try{JsBarcode("#barcode",jan,{format:"EAN13",width:2,height:100,displayValue:true,fontSize:18,margin:10})}catch(e){console.error(e)}
 document.getElementById("message").textContent="変換しました！";
}
</script>
</body>
</html>

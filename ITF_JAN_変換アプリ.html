<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ITF → JAN 変換</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;background:#f5f5f7;color:#111}
main{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{text-align:center;font-size:26px;margin:10px 0 18px}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:#007aff;color:white;width:100%;margin-top:8px}
button.secondary{background:#e9e9ee;color:#111}
button.danger{background:#ff3b30}
video{width:100%;border-radius:14px;background:#111;display:block;max-height:360px;object-fit:cover}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:17px}
.result{text-align:center}
.code{font-size:22px;font-weight:700;letter-spacing:1px;margin:8px 0}
#barcode{max-width:100%;height:110px}
.small{font-size:13px;color:#666;line-height:1.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.list{font-size:14px}.item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:10px 0;gap:8px}.item button{width:auto;margin:0;padding:8px 10px;font-size:13px}
.status{text-align:center;font-weight:600;margin:8px 0;color:#555}
</style>
</head>
<body>
<main>
<h1>ITF → JAN 変換</h1>

<div class="card">
  <video id="video" playsinline></video>
  <div id="status" class="status">「カメラを起動」を押してください</div>
  <button id="start">📷 カメラを起動</button>
  <button id="stop" class="secondary">カメラを停止</button>
</div>

<div class="card">
  <label>読み取ったITFコード</label>
  <input id="itf" placeholder="ITFコード" inputmode="numeric">
  <button id="convert">JANに変換</button>
</div>

<div class="card result">
  <div class="small">変換後のJANコード</div>
  <div id="jan" class="code">---</div>
  <svg id="barcode"></svg>
  <button id="clear" class="secondary">表示をクリア</button>
</div>

<div class="card">
  <h3>対応表</h3>
  <div class="small">ITFを読み取ったとき、このJANを表示します。登録内容はこのiPhoneのブラウザに保存されます。</div>
  <label>ITFコード</label><input id="newItf" inputmode="numeric" placeholder="例：12345678901234">
  <label>JANコード</label><input id="newJan" inputmode="numeric" placeholder="例：4901234567890">
  <button id="add">＋ 対応表に登録</button>
  <div id="list" class="list"></div>
</div>

<p class="small">
※ カメラを使うため、Safariで開いてください。初回はカメラ使用の許可が必要です。<br>
※ この版は対応表をiPhone内に保存します。別のiPhoneやPCとは共有されません。
</p>
</main>

<script>
const LS='itfJanMapV1';
let map=JSON.parse(localStorage.getItem(LS)||'{}');
let controls=null;

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(LS,JSON.stringify(map)); render();}
function validDigits(s){return /^\\d+$/.test(s||'');}

function convert(){
  const itf=$('itf').value.trim();
  if(!validDigits(itf)){ $('status').textContent='ITFコードを入力してください'; return; }
  const jan=map[itf];
  if(!jan){
    $('jan').textContent='該当なし';
    $('barcode').innerHTML='';
    $('status').textContent='このITFは対応表に登録されていません';
    return;
  }
  $('jan').textContent=jan;
  JsBarcode('#barcode',jan,{format:'ean13',displayValue:true,fontSize:18,height:75,margin:8});
  $('status').textContent='変換しました';
}

function render(){
  const el=$('list'); el.innerHTML='';
  const keys=Object.keys(map);
  if(!keys.length){el.innerHTML='<div class="small" style="margin-top:12px">登録はまだありません。</div>';return;}
  keys.forEach(k=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML='<span><b>'+k+'</b> → '+map[k]+'</span>';
    const b=document.createElement('button'); b.className='danger'; b.textContent='削除';
    b.onclick=()=>{delete map[k];save()};
    d.appendChild(b);el.appendChild(d);
  });
}

$('convert').onclick=convert;
$('itf').addEventListener('keydown',e=>{if(e.key==='Enter')convert()});
$('clear').onclick=()=>{$('jan').textContent='---';$('barcode').innerHTML='';$('status').textContent=''};
$('add').onclick=()=>{
  const a=$('newItf').value.trim(), b=$('newJan').value.trim();
  if(!validDigits(a)||!validDigits(b)){alert('ITFとJANは数字だけで入力してください');return}
  if(b.length!==13){alert('JANは13桁で入力してください');return}
  map[a]=b; save(); $('newItf').value='';$('newJan').value='';
};

let reader;
$('start').onclick=async()=>{
  try{
    if(!reader) reader=new ZXingBrowser.BrowserMultiFormatReader();
    $('status').textContent='カメラ起動中…';
    const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    const device=devices.find(d=>/back|rear|environment/i.test(d.label))||devices[0];
    if(!device) throw new Error('カメラが見つかりません');
    controls=await reader.decodeFromVideoDevice(device.deviceId,$('video'),(result,err)=>{
      if(result){
        const text=result.getText().trim();
        $('itf').value=text;
        convert();
        if(navigator.vibrate) navigator.vibrate(120);
      }
    });
    $('status').textContent='バーコードを映してください';
  }catch(e){
    $('status').textContent='カメラを起動できませんでした。Safariで開き、カメラを許可してください。';
    console.error(e);
  }
};
$('stop').onclick=()=>{
  try{ if(controls) controls.stop(); }catch(e){}
  $('video').srcObject=null;
  $('status').textContent='カメラを停止しました';
};
render();
</script>
</body>
</html>
